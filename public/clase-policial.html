<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clase policial · ClinicIA</title><link rel="stylesheet" href="/capacitacion.css"><style>main{max-width:960px}.slide{min-height:68vh;padding:32px;background:#fff;border:2px solid #17634f;border-radius:20px;margin:20px 0;page-break-after:always}.slide h2{font-size:clamp(26px,4vw,42px)}.slide li{font-size:clamp(17px,2vw,23px);margin:20px 0}.toolbar{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:10px;flex-wrap:wrap;z-index:2}@media print{.toolbar{display:none}.slide{border:none;min-height:90vh}}</style></head><body><header class="top"><a href="/capacitacion.html">✚ ClinicIA</a><strong>Material para instructor</strong></header><main><div class="toolbar"><button onclick="window.print()">Imprimir / Guardar PDF</button><a href="/capacitacion.html">Volver al panel</a></div><div id="slides"></div></main><script type="module">import {policeCourse} from '/learn/content/respuesta-policial.mjs';const safe=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const slides=[['Cómo funciona ClinicIA',['Elegí Soy alumno o Soy instructor','El alumno estudia, practica y rinde','El instructor crea grupos, acepta alumnos y valida prácticas','El avance se conserva al ingresar con una cuenta activa']],['Plan de la jornada',['Bloque A: módulos 1–3 → simulación 1','Bloque B: módulos 4–6 → simulación 2','Bloque C: módulos 7–10 → simulación 3','Examen final: 50 preguntas, mínimo 40 correctas']]];policeCourse.lessons.forEach((l,i)=>{slides.push([l.title,[l.body.split('\\n\\n')[0], 'Caso práctico: '+(l.simulation?.scenario||'Analizar una situación de emergencia y comunicarla')]]);if([2,5,9].includes(i))slides.push(['Simulación '+([2,5,9].indexOf(i)+1),[l.simulation?.scenario||'Caso integrador','Rotar roles de respondiente, testigo y observador','Ejercicio final: explicar decisiones y realizar un pase radial','El instructor observa y registra criterios']]);});slides.push(['Examen final',['50 preguntas individuales','Aprobación con 40 respuestas correctas','Revisión de prácticas por el instructor','Certificación sujeta a requisitos y autorización']]);document.querySelector('#slides').innerHTML=slides.map((s,i)=>'<section class="slide"><p>CLINICIA · DIAPOSITIVA '+(i+1)+' / '+slides.length+'</p><h2>'+safe(s[0])+'</h2><ul>'+s[1].map(t=>'<li>'+safe(t)+'</li>').join('')+'</ul></section>').join('');</script></body></html>
