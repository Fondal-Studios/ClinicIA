<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apertura de la clase · 10 minutos · ClinicIA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071b25;color:#e9f4f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#102d36;border-bottom:1px solid #28505b}
.bar button,.bar a{background:#1d5a63;color:#fff;border:0;border-radius:10px;padding:10px 14px;font:700 15px inherit;text-decoration:none;cursor:pointer}.bar .sp{flex:1}.timer{font:700 20px ui-monospace,monospace}.timer.over{color:#ffb4a8}
main{max-width:1100px;margin:0 auto;padding:16px}.slide{min-height:74vh;display:none;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:34px;border-radius:22px;background:linear-gradient(135deg,#102d36,#163e45 60%,#0c252f);border:1px solid #48706c}
.slide.on{display:grid}.slide h2{font-size:clamp(30px,4.4vw,56px);line-height:1.06;margin:0 0 22px;letter-spacing:-1px}.slide ul{padding-left:22px;margin:0}.slide li{font-size:clamp(18px,2vw,27px);line-height:1.45;margin:12px 0}
.tag{color:#8de1c9;font-weight:700;letter-spacing:.08em;font-size:14px;margin:0 0 12px}.big{font:700 clamp(22px,3vw,40px)/1.25 ui-monospace,monospace;color:#f8c17f;overflow-wrap:anywhere}
.art{display:grid;place-items:center;font-size:clamp(90px,14vw,190px)}.notes{display:none;margin:14px 0;padding:16px;border-radius:14px;background:#0e2a33;border:1px dashed #48706c;font-size:18px;line-height:1.5}.notes.on{display:block}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:12px;height:12px;border-radius:50%;background:#2d5560}.dots i.on{background:#8de1c9}
@media(max-width:760px){.slide{grid-template-columns:1fr;padding:20px;min-height:auto}.art{font-size:80px}}
@media print{body{background:#fff;color:#000}.bar,.notes,.dots{display:none!important}.slide{display:grid!important;page-break-after:always;background:#fff;border:1px solid #888;color:#000;min-height:170mm}.slide h2,.tag,.big{color:#000}}
</style></head><body>
<div class="bar"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="notes">Notas del instructor (N)</button><button id="full">Pantalla completa (F)</button><a href="/plan-clase.html">Plan de la jornada</a><a href="/capacitacion.html?perfil=instructor">Panel del instructor</a><span class="sp"></span><span class="timer" id="timer" title="Tiempo desde que tocás Siguiente por primera vez">0:00 / 10:00</span></div>
<main><div id="slides"></div><div class="dots" id="dots"></div><div class="notes" id="speaker"></div></main>
<script type="module">
const origin=location.origin;
const S=[
 {t:'0:00',h:'Primeros auxilios para primeros respondedores',tag:'RESPUESTA TÁCTICA PREHOSPITALARIA',art:'🚑',li:['Capacitación introductoria · 3 horas','Teoría en el celular, práctica en grupos de tres y examen final','Instructor: Dr. Mariano Jiménez'],n:'Bienvenida (45–60 s). Presentarse y decir en una frase para qué sirve la jornada: que cada uno sepa qué hacer en los primeros minutos, antes de que llegue la ayuda médica. Pedir celulares cargados y a mano.'},
 {t:'1:00',h:'¿Por qué ustedes?',tag:'EL PRIMER CONTACTO',art:'🚓',li:['Ustedes llegan primero: antes que la ambulancia','Lo que se hace en los primeros minutos importa: sangrado, respiración, aviso correcto','No se trata de ser médicos: se trata de hacer pocas cosas, bien y en orden'],n:'60 s. Anclar con una situación conocida (choque en ruta, persona caída en la vía pública). Mensaje clave: ustedes no reemplazan al equipo médico, lo preparan y lo orientan. Evitar cifras o estadísticas si no las pueden respaldar.'},
 {t:'2:00',h:'Qué vamos a poder hacer al terminar',tag:'OBJETIVOS',art:'🎯',li:['Asegurar la escena antes de tocar a nadie','Evaluar con una secuencia simple (ABCDE) y reevaluar','Controlar un sangrado grave','Reconocer un paro e iniciar RCP; saber usar un DEA','Pasar un aviso claro por radio al hospital'],n:'75 s. Leer los cinco objetivos. Decir que todo lo que se enseña es lo que cualquier persona entrenada puede hacer, dentro de su rol y su protocolo.'},
 {t:'3:15',h:'La secuencia que ordena todo',tag:'PRIORIDADES',art:'🧭',li:['1 · Escena segura (si no es segura, no entro)','2 · Sangrado grave: controlarlo primero','3 · Vía aérea, respiración, circulación','4 · Pedir ayuda y pasar el aviso','5 · Reevaluar y proteger del frío'],n:'75 s. Es el esqueleto de los diez módulos. Insistir: seguridad propia primero; hemorragia masiva antes que el resto cuando es evidente; reevaluar siempre.'},
 {t:'4:30',h:'Cómo vamos a trabajar hoy',tag:'LAS 3 HORAS',art:'⏱️',li:['Apertura y alta en la aplicación (25 min)','Tres bloques de módulos con práctica en tríos','Pausa de 10 minutos','Examen final: 50 preguntas en el celular','Cierre y prácticas pendientes'],n:'60 s. Mostrar el reloj. Aclarar: en cada práctica hay tres roles (respondiente, víctima o testigo, observador/enlace) y se rota. No hay maniquíes: las víctimas son sus compañeros.'},
 {t:'5:30',h:'Reglas de seguridad de la práctica',tag:'ENSAYO ≠ EMERGENCIA REAL',art:'🛡️',li:['Gestos sin presionar el tórax','DEA real apagado: nunca descargas','Sin tracciones de cuello ni levantamientos bruscos','Torniquete: se ajusta sobre un soporte inanimado, no sobre un compañero','Si alguien se siente mal o se lastima, se frena la práctica'],n:'75 s. Es lo más importante para evitar accidentes. Repetirlo con tono firme. Decir que lo que se ensaya hoy es un ensayo de clase; en una emergencia real se sigue el protocolo institucional.'},
 {t:'6:45',h:'Cómo usamos la aplicación',tag:'ENTRAR EN 1 MINUTO',art:'📱',li:['Abrí el enlace de la clase en el celular','Escribí tu nombre y apellido: no hace falta contraseña','Anotá tu usuario y tu código (sacale captura)','Leé el módulo, resolvé los microcasos y pedí que te validen la práctica'],big:origin+'/capacitacion.html',n:'75 s. Proyectar el enlace y el código del grupo del panel del instructor. Si alguien no puede entrar, el ayudante lo asiste en el alta. Si el celular se cierra, se vuelve a entrar con usuario y código.'},
 {t:'8:00',h:'Prácticas y validación',tag:'LO QUE CUENTA',art:'✅',li:['Tres prácticas obligatorias: RCP y DEA, hemorragia con torniquete, politrauma con protección cervical','Marcar «realizada» en el celular no alcanza: el instructor observa y valida','Si hoy no alcanza el tiempo, se completa en una segunda instancia: nadie se aprueba “en bloque”'],n:'60 s. Ser transparente: con 30 personas y 2 observadores no se llega a ver a todos en todas las prácticas. Se valida lo que se observa; lo pendiente queda en el panel.'},
 {t:'9:00',h:'Examen final y certificado',tag:'CÓMO SE APRUEBA',art:'📜',li:['Examen de 50 preguntas · 40 correctas para aprobar','Intentos ilimitados, sin penalización','Certificado: teoría + examen aprobado + tres prácticas validadas + autorización del instructor responsable'],n:'45 s. Aclarar que es una capacitación introductoria y no reemplaza protocolos ni acreditaciones oficiales de otras entidades. El certificado es de la capacitación, con el alcance que dice.'},
 {t:'9:45',h:'Empezamos',tag:'AHORA',art:'▶️',li:['Abrí el enlace','Nombre y apellido','Anotá tu código','Esperá el módulo 1: escena segura'],big:origin+'/capacitacion.html',n:'15 s y pasar directamente al alta (15 minutos). Dejar proyectado el enlace y el código del grupo hasta que todos estén adentro.'}
];
const el=document.querySelector('#slides');el.innerHTML=S.map((s,i)=>`<section class="slide" data-i="${i}"><div><p class="tag">DIAPOSITIVA ${i+1}/${S.length} · ${s.t} · ${s.tag}</p><h2></h2><ul>${s.li.map(()=>'<li></li>').join('')}</ul>${s.big?'<p class="big"></p>':''}</div><div class="art" aria-hidden="true">${s.art||'🚑'}</div></section>`).join('');
[...el.children].forEach((sec,i)=>{sec.querySelector('h2').textContent=S[i].h;sec.querySelectorAll('li').forEach((li,k)=>li.textContent=S[i].li[k]);if(S[i].big)sec.querySelector('.big').textContent=S[i].big;});
document.querySelector('#dots').innerHTML=S.map(()=>'<i></i>').join('');
let i=0,t0=null;const slides=[...el.children],dots=[...document.querySelectorAll('#dots i')],notes=document.querySelector('#speaker');
function go(n){i=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i));notes.textContent='Notas ('+S[i].t+'): '+S[i].n;if(!t0&&i>0)t0=Date.now();}
document.querySelector('#next').onclick=()=>go(i+1);document.querySelector('#prev').onclick=()=>go(i-1);
document.querySelector('#notes').onclick=()=>notes.classList.toggle('on');document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1);}else if(['ArrowLeft','PageUp'].includes(e.key))go(i-1);else if(e.key==='n'||e.key==='N')notes.classList.toggle('on');else if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.();});
setInterval(()=>{const s=t0?Math.floor((Date.now()-t0)/1000):0,m=Math.floor(s/60),tm=document.querySelector('#timer');tm.textContent=m+':'+String(s%60).padStart(2,'0')+' / 10:00';tm.classList.toggle('over',s>600);},500);
go(0);
</script></body></html>
