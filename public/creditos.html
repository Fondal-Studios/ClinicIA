<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créditos de imágenes · ClinicIA</title><link rel="stylesheet" href="/capacitacion.css"></head><body><header class="top"><a href="/capacitacion.html">← Volver a la formación</a></header><main id="content"><h1>Créditos de imágenes</h1><p class="lead">Las imágenes de referencia de terceros provienen de Wikimedia Commons con licencias libres. Solo se redujo su tamaño. Los esquemas con cuadros y flechas de cada módulo son originales de ClinicIA.</p><div id="lista"></div></main><script type="module">
import {imageCredits} from '/learn/credits.mjs';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('lista').innerHTML=Object.values(imageCredits).map(c=>`<article><img src="${esc(c.file)}" alt="${esc(c.alt)}" style="max-width:220px;height:auto"><h2>${esc(c.title)}</h2><p>Autor: ${esc(c.author)}<br>Licencia: <a href="${esc(c.license.url)}" rel="noopener">${esc(c.license.name)}</a><br><a href="${esc(c.source)}" rel="noopener">Página de origen</a></p></article>`).join('');
</script></body></html>
