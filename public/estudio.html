<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudiar con mi material · ClinicIA</title><link rel="stylesheet" href="/style.css"><style>
.card{border:1px solid #8884;border-radius:12px;padding:1rem;margin:.7rem 0}.card input[type=text],.card input[type=number]{width:100%;box-sizing:border-box;font:inherit;padding:.5rem;border:1px solid #8886;border-radius:8px}.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}.muted{opacity:.75;font-size:.92rem}.notice{background:#fff8e1;border:1px solid #e6c860;border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.92rem;color:#4a3b00}label.check{display:block;margin:.5rem 0}.range{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.range input{width:6rem!important}
.path{display:grid;gap:.6rem;margin:1rem 0}.node{display:flex;justify-content:space-between;align-items:center;gap:.6rem;border:2px solid #8884;border-radius:14px;padding:.8rem 1rem;background:#fff;cursor:pointer;font:inherit;text-align:left;width:100%}.node.done{border-color:#58a700;background:#f1fbe6}.node strong{display:block}
.player{max-width:640px;margin:0 auto}.topbar{display:flex;align-items:center;gap:.8rem;margin:.5rem 0 1.5rem}.topbar progress{flex:1;height:14px;accent-color:#58a700}.q{font-size:1.3rem;font-weight:700;line-height:1.35;margin:1rem 0}.blank{display:inline-block;min-width:4rem;border-bottom:3px solid #17323b;margin:0 .2rem}
.choices{display:grid;gap:.6rem}.choice{font:inherit;text-align:left;border:2px solid #cfd8d3;border-bottom-width:4px;border-radius:14px;padding:.85rem 1rem;background:#fff;cursor:pointer}.choice[aria-pressed=true]{border-color:#1cb0f6;background:#e6f6ff}.choice:disabled{cursor:default;opacity:1;color:#17323b}.topbar progress{-webkit-appearance:none;appearance:none;border:0;border-radius:99px;background:#dfe6e2;overflow:hidden}.topbar progress::-webkit-progress-bar{background:#dfe6e2;border-radius:99px}.topbar progress::-webkit-progress-value{background:#58a700;border-radius:99px}.topbar progress::-moz-progress-bar{background:#58a700;border-radius:99px}.choice.right{border-color:#58a700;background:#e8f8d4}.choice.wrong{border-color:#d33;background:#fde8e8}
.feedback{margin-top:1.2rem;padding:1rem;border-radius:14px}.feedback.ok{background:#e8f8d4}.feedback.no{background:#fde8e8}.feedback h2{margin:0 0 .3rem;font-size:1.15rem}.evidence{font-size:.9rem;margin:.5rem 0;padding:.5rem .7rem;border-left:4px solid #8886;background:#0000000a}
.big{font:inherit;font-weight:700;padding:.85rem 1.4rem;border:0;border-radius:14px;background:#58a700;color:#fff;border-bottom:4px solid #3d7500;cursor:pointer;width:100%;margin-top:1rem}.big:disabled{background:#cfd8d3;border-bottom-color:#aab5af;cursor:not-allowed}.big.secondary{background:#fff;color:#17323b;border:2px solid #cfd8d3;border-bottom-width:4px}
.summary{text-align:center;padding:2rem 0}.summary .xp{font-size:2.4rem;font-weight:800}</style></head><body class="admin-body"><main class="admin-main"><a href="/">← Volver a estudiar</a><span class="eyebrow">CLINICIA · MI MATERIAL</span><h1>Estudiar con mi material</h1><p id="status" role="status"></p><div id="app"></div></main><script type="module" src="/estudio.mjs"></script></body></html>
