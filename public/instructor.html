<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instructor · ClinicIA</title>
<link rel="stylesheet" href="/style.css">
<style>
 main{max-width:960px;margin:0 auto;padding:16px}
 .big[hidden]{display:none}.big{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:16px 0}
 .big a{display:block;padding:20px;border-radius:14px;border:2px solid #17634f;background:#eaf3ed;color:#173b38;text-decoration:none}
 .big a.primary{background:#17634f;color:#fff}.big strong{display:block;font-size:1.25rem}
 .card{border:1px solid #b6cbc4;border-radius:12px;padding:12px;margin:10px 0;background:#fff;color:#173b38}
 table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid #d6e2dc;text-align:left}th button{font-weight:700;background:none;border:0;padding:0;cursor:pointer}
 .bar{display:inline-block;width:80px;height:8px;background:#d6e2dc;border-radius:4px;vertical-align:middle}.bar i{display:block;height:8px;background:#17634f;border-radius:4px}
 .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.wrap{overflow-x:auto}.code{font:700 1.3rem monospace;letter-spacing:.12em}
</style>
</head>
<body>
<main>
<span class="eyebrow">CLINICIA · INSTRUCTOR</span>
<h1>Instructor</h1>
<p id="status" role="status">Cargando…</p>
<div class="big">
 <a class="primary" href="/aulas.html#crear"><strong>Crear curso y contenido</strong>Con ayuda de la IA, editá teoría, presentación, preguntas e imágenes.</a>
 <a href="#mis-cursos"><strong>Mis cursos</strong>Los cursos que ya estás dando: alumnos, notas y progreso.</a>
</div>
<section id="mis-cursos"><h2>Mis cursos</h2><div id="lista"></div></section>
<section id="detalle" hidden></section>
</main>
<script type="module" src="/areas.mjs"></script>
<script type="module" src="/instructor.mjs"></script>
</body>
</html>
