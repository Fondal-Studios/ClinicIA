name: ClinicIA checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --input-type=module -e "import {courses,questions} from './public/learn/courses.mjs'; console.log('CATALOG_TOTAL courses='+courses.length+' questions='+questions.length)"
      - run: npm test
      - run: npm run check
      - run: npm run audit:learning
      - run: npm run audit:academic
