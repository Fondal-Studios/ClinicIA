[build]
  functions = "netlify/functions"
  publish = "public"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[redirects]]
  from = "/api/tutor"
  to = "/.netlify/functions/tutor"
  status = 200
[[redirects]]
  from = "/api/tutor-class"
  to = "/.netlify/functions/tutor-class"
  status = 200
